server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: microservice-a
          uri: lb://microservice-a
          predicates:
            - Path=/users/**
        - id: microservice-b
          uri: lb://microservice-b
          predicates:
            - Path=/products/**
        - id: microservice-c
          uri: lb://microservice-c
          predicates:
            - Path=/orders/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
